<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Questionário sobre HTML e CSS">
    <meta name="author" content="Ravanny da Silva Trajano Galvão Navarro">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <main>
        <h1>Questionário de HTML e CSS</h1>

        <form>
            <div class="formulario">

                <label for="q1">
                    1. Qual linguagem é usada para estruturar uma página web?
                </label>
                <input type="text" id="q1" name="q1" required>

                <label for="q2">
                    2. Explique brevemente para que serve o CSS em uma página web.
                </label>
                <textarea id="q2" name="q2" rows="4" required></textarea>

                <label for="q3">
                    3. Qual propriedade CSS é usada para alterar a cor do texto?
                </label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Escolha uma opção...</option>
                    <option value="background-color">background-color</option>
                    <option value="color">color</option>
                    <option value="font-size">font-size</option>
                </select>

                <label for="q4">
                    4. Quantos níveis de títulos HTML existem, de h1 até h6?
                </label>
                <input type="number" id="q4" name="q4" min="1" max="6" required>

                <button type="submit">Enviar Questionário</button>

            </div>
        </form>
    </main>
</body>

</html>
